name: Publish bmux pilot worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: registry.tonisives.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: browser-worker
          file: browser-worker/Dockerfile.bmux
          build-args: BMUX_IMAGE=registry.tonisives.com/bmux-host:pilot
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            registry.tonisives.com/sitelytics-bmux-pilot:pilot
            registry.tonisives.com/sitelytics-bmux-pilot:${{ github.sha }}
