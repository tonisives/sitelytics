name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitelytics-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Check deployment credentials
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          for name in REGISTRY_USERNAME REGISTRY_PASSWORD DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "$name is not set"
              exit 1
            fi
          done

      - uses: actions/checkout@v6

      - name: Set image tag
        id: version
        run: echo "tag=d$(date -u +%Y-%m-%d-%H%M)-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: registry.tonisives.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: etc/deploy/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: registry.tonisives.com/tgs/sitelytics:${{ steps.version.outputs.tag }}
          cache-from: type=registry,ref=registry.tonisives.com/tgs/sitelytics:buildcache-main
          cache-to: type=registry,ref=registry.tonisives.com/tgs/sitelytics:buildcache-main,mode=max,oci-mediatypes=true,image-manifest=true,ignore-error=true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy image to Kubernetes
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^d[0-9-]+-[0-9a-f]{7}$ ]] ||
             [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image reference"
            exit 1
          fi
          image="registry.tonisives.com/tgs/sitelytics:$IMAGE_TAG@$IMAGE_DIGEST"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | ssh-add -
          mkdir -p ~/.ssh
          ssh-keyscan -H 65.21.196.249 >> ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes root@65.21.196.249 \
            "kubectl -n utils set image deployment/sitelytics sitelytics=$image && \
             kubectl -n utils rollout status deployment/sitelytics --timeout=180s && \
             kubectl -n utils set image deployment/sitelytics-seo-worker worker=$image && \
             kubectl -n utils rollout status deployment/sitelytics-seo-worker --timeout=180s"
