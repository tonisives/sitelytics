apiVersion: apps/v1
kind: Deployment
metadata:
  name: sitelytics-seo-browser-worker
  namespace: utils
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sitelytics-seo-browser-worker
  template:
    metadata:
      labels:
        app: sitelytics-seo-browser-worker
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: registry.tonisives.com/tgs/sitelytics-seo-browser:seo-20260925-6@sha256:81b19038481c0839a1202146e0f4611ab91cb2235e85f6ad0bcbe694d8fe0da3
          envFrom:
            - secretRef:
                name: sitelytics-secrets
          env:
            - name: KAFKA_BROKERS
              value: redpanda.redpanda.svc.cluster.local:9093
            - name: SITELYTICS_URL
              value: http://sitelytics.utils.svc.cluster.local:19000
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
      imagePullSecrets:
        - name: tonisives-registry-secret
